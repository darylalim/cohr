# Lang eval set (PLAN §18, 6d-1): English meetings, notes in another language. Same scripts and
# media as the quick items of the same seed; only the target changes. Scored with
# cross-language matching (exact fields + judge recall). Report-only baseline:
# evals/baseline-lang.json.
# Run: uv run cohr eval --set lang -c seed=1 --no-ask
items:
  - id: conflict-de  # slide-conflict-en, German notes: the "(slide: …)" note in German
    seed: 4
    target: de
    media: video
    slides: video
    gaps: [silence]
    conflict: true

  - id: clean-ar  # clean-en, Arabic notes: right-to-left text
    seed: 1
    target: ar
    media: video
    slides: video
    gaps: [silence]

  - id: clean-sw  # clean-en, "Other (beta)" Swahili: English notes translated by Tiny Aya
    seed: 1
    target: sw
    media: video
    slides: video
    gaps: [silence]
