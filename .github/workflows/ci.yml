name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  HF_HUB_OFFLINE: "1"          # no model downloads in CI, ever
  ALLOW_TORCH: "0"             # Phase 0 (D9): torch is absent from uv.lock
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no moving major tags)
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: command -v ffmpeg || brew install ffmpeg
      - name: Sync (lockfile must be current; all groups so ty sees eval imports)
        run: uv sync --locked --all-groups
      - name: No PyTorch (§1 all-MLX rule)
        run: |
          if [ "$ALLOW_TORCH" != "1" ] && grep -q '^name = "torch' uv.lock; then
            uv tree --invert --package torch
            echo "::error::torch is in uv.lock; see PLAN §1 / §9 Phase 0"; exit 1
          fi
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Type check
        run: uv run ty check
      - name: Unit tests
        run: uv run pytest -q -m "not models"
  release:                       # PLAN §16: a new [project].version on main → tag + Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest       # building sdist/wheel needs no MLX
    timeout-minutes: 10
    permissions:
      contents: write            # this job only; the workflow default stays read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0         # all tags, for the downgrade check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no moving major tags)
      - name: Read version
        id: v
        run: |
          V=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$V already released; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse downgrade
        if: steps.v.outputs.exists == 'false'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          LATEST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n' "$LATEST" "$V" | sort -V | tail -1)" != "$V" ]; then
            echo "::error::version $V is lower than latest tag v$LATEST"; exit 1
          fi
      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: uv build                # dist/*.whl + dist/*.tar.gz
      - name: Create release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          PRE=""; case "$V" in *a*|*b*|*rc*|*dev*) PRE="--prerelease";; esac
          gh release create "v$V" dist/*.whl dist/*.tar.gz --target "$GITHUB_SHA" --title "v$V" --generate-notes $PRE
